# Publishes the explanatory page (site/index.html) to GitHub Pages.
# Requires Settings > Pages > Source: "GitHub Actions".
#
# The page is generated by site/build.py and committed; the build workflow
# checks that the committed page matches the code and the outputs, so this
# workflow publishes it as it is.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Collect the page
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
